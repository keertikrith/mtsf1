<div class="register-root">
    <header class="register-header">
        <h1 class="app-title">Transfer</h1>
        <p class="app-subtitle">Create your account in seconds</p>
    </header>

    <div class="register-card">
        <div class="register-heading">
            <h2 class="heading">Create account</h2>
            <p class="subtext">Set up your account to start transferring money</p>
        </div>

        <form (ngSubmit)="createAccount()" class="register-form">
            <div class="form-group">
                <label for="username" class="label">Username *</label>
                <input type="text" id="username" [(ngModel)]="username" name="username"
                    placeholder="Choose a username" required class="input-field" />
            </div>

            <div class="form-group">
                <label for="password" class="label">Password *</label>
                <input type="password" id="password" [(ngModel)]="password" name="password"
                    placeholder="Choose a strong password" required class="input-field" />
            </div>

            <div class="form-group">
                <label for="holderName" class="label">Full Name *</label>
                <input type="text" id="holderName" [(ngModel)]="holderName" name="holderName"
                    placeholder="Your full name" required class="input-field" />
            </div>

            <div class="form-group">
                <label for="initialBalance" class="label">Initial Balance (optional)</label>
                <input type="number" id="initialBalance" [(ngModel)]="initialBalance" name="initialBalance"
                    placeholder="0.00" min="0" step="0.01" pattern="^\d*\.?\d{0,2}$"
                    inputmode="decimal" class="input-field" />
            </div>

            <div class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <div class="success-message" *ngIf="successMessage">
                {{ successMessage }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="isLoading">
                {{ isLoading ? 'Creating account...' : 'Create account' }}
            </button>
        </form>

        <div class="divider"></div>

        <div class="auth-link-section">
            <p class="auth-text">Already have an account?</p>
            <a routerLink="/login" class="auth-link">Sign in here</a>
        </div>
    </div>
</div>
