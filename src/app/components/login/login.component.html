<div class="login-root">
  <header class="login-header">
    <h1 class="app-title">Transfer</h1>
    <p class="app-subtitle">Fast, secure money transfers</p>
  </header>

  <div class="login-card">
    <div class="login-heading">
      <h2 class="heading">Sign in</h2>
      <p class="subtext">Enter your credentials to access your account</p>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="username" class="label">Username</label>
        <input 
          type="text" 
          id="username" 
          [(ngModel)]="username" 
          name="username"
          placeholder="Enter username"
          required
          class="input-field"
        />
      </div>

      <div class="form-group">
        <label for="password" class="label">Password</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="Enter password"
          required
          class="input-field"
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="divider"></div>

    <div class="auth-link-section">
      <p class="auth-text">Don't have an account?</p>
      <a routerLink="/create-account" class="auth-link">Create one here</a>
    </div>
  </div>
</div>
