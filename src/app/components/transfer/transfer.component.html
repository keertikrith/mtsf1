<div class="transfer-root">
    <header class="header-row">
        <div>
            <h1 class="heading">Transfer</h1>
            <p class="subheading">Move money securely and quickly</p>
        </div>
        <a routerLink="/dashboard" class="link-back" aria-label="Back to dashboard">
            <svg class="icon-back" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5M5 12l7-7m-7 7l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
        </a>
    </header>

    <form (ngSubmit)="transfer()" class="transfer-form">
        <section class="row sender-receiver">
            <div class="account from">
                <div class="avatar" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" focusable="false" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="3" stroke="currentColor" stroke-width="1.2"></circle>
                        <path d="M4 20c1.5-4 6-6 8-6s6.5 2 8 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
                    </svg>
                </div>
                <div class="meta">
                    <label class="label">From</label>
                    <div class="account-id">Account #{{ fromAccountId }}</div>
                </div>
            </div>

            <div class="account to">
                <div class="avatar small" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" focusable="false" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.2"></rect>
                    </svg>
                </div>
                <div class="meta">
                    <label class="label" for="toAccount">To</label>
                    <input id="toAccount" type="text" [(ngModel)]="toAccountIdInput" name="toAccount" required
                           placeholder="Recipient account ID" class="input-plain" />
                    <div class="hint muted">Tip: accept formats like <em>ACC-000123</em></div>
                </div>
            </div>
        </section>

        <section class="row amount-area" aria-labelledby="amountLabel">
            <label id="amountLabel" class="label">Amount</label>
            <input id="amount" type="number" [(ngModel)]="amount" name="amount" required min="0.01" step="0.01"
                   inputmode="decimal" placeholder="0.00" class="amount-input" />
        </section>

        <section class="row controls">
            <div class="messages">
                <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>
                <div class="success" *ngIf="successMessage">{{ successMessage }}</div>
            </div>

            <div class="cta-wrap">
                <button type="submit" class="btn-primary" [disabled]="isLoading">
                    <span class="primary-text">{{ isLoading ? 'Processing...' : 'Send Money' }}</span>
                    <span class="secondary-text">Secure transfer</span>
                </button>
            </div>
        </section>
    </form>
</div>
